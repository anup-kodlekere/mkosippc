name: Docker-in-Runner

on:
  workflow_dispatch:
  push:

jobs:
  build:
    name: Build on ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: ppc64le
            runner: ubuntu-24.04-ppc64le
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Inspect
        run: |
          echo "Running on ${{ matrix.arch }}"

          echo "Home is : $HOME \n"
          
          env

          cat ~/.bashrc

          # nproc
          # free -h
          # df -h

          # whoami
          # ls /sys/fs/cgroup/
          # sudo cat /sys/fs/cgroup/cpuset.cpus
          # sudo cat /proc/stat
          # docker run  -t ubuntu:latest bash -c 'cat /sys/fs/cgroup/cpuset.cpus && nproc'
          
